name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: homenet-panel/go.mod
      - name: 单元测试
        working-directory: homenet-panel
        run: go vet ./... && go test ./... -count=1
      - name: 交叉编译
        run: |
          set -e
          mkdir -p dist
          # 名称:GOARCH:GOARM —— 名字是产物名，GOARM 仅 armv7 需要
          for spec in amd64:amd64:0 arm64:arm64:0 armv7:arm:7 386:386:0; do
            name=${spec%%:*}; rest=${spec#*:}
            goarch=${rest%%:*}; goarm=${rest##*:}
            unset GOARM
            [ "$goarm" != 0 ] && export GOARM=$goarm   # 只有 GOARCH=arm 用得上
            ( cd homenet-panel && GOOS=linux GOARCH=$goarch CGO_ENABLED=0 \
                go build -trimpath -ldflags '-s -w' -o ../dist/homenet-panel-linux-$name ./cmd/homenet-panel )
          done
          cp deploy/install.sh deploy/online-install.sh deploy/verify-install.sh dist/
          ( cd dist && sha256sum homenet-panel-linux-* > sha256sums.txt && cat sha256sums.txt )
      - name: 发布 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          echo "$TAG" > dist/VERSION
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" --notes "HomeNet Panel $TAG：linux/amd64、arm64、armv7、386 静态二进制 + 在线安装脚本" \
            || gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber

      # 把产物发布到 dist 分支（可变，指向最新）与 <tag>-dist 分支（不可变快照），
      # 让没有 GitHub 直连的初始环境也能经 jsDelivr 等 CDN 安装。
      - name: 发布 dist 分支（CDN）
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          cd dist
          git init -q -b dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "dist: $TAG"
          REMOTE="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -f "$REMOTE" dist
          # 还要一个带 -dist 的**标签**：jsDelivr 只索引分支 dist，且 dist 有缓存滞后；
          # 标签形式的 vX.Y.Z-dist 能被 CDN 正常解析并永久缓存。
          git tag -f "$TAG-dist" >/dev/null
          git push -f "$REMOTE" "refs/tags/$TAG-dist"
          echo "已发布分支 dist 与标签 $TAG-dist"

      - name: 刷新 jsDelivr 缓存
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        run: |
          for f in online-install.sh install.sh verify-install.sh sha256sums.txt VERSION \
                   homenet-panel-linux-amd64 homenet-panel-linux-arm64 \
                   homenet-panel-linux-armv7 homenet-panel-linux-386; do
            curl -fsS --max-time 20 "https://purge.jsdelivr.net/gh/${{ github.repository }}@dist/$f" >/dev/null || true
            curl -fsS --max-time 20 "https://purge.jsdelivr.net/gh/${{ github.repository }}@${{ github.ref_name }}-dist/$f" >/dev/null || true
          done
